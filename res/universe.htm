<!DOCTYPE html>
<html>
<body>
<h1>Particle Life v1.0</h1>

<canvas id="myCanvas" width="600" height="600" style="border:1px solid #000000;">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");
const n = 1000;
const dt = 0.02;
const frictionHalfLife = 0.04;
const frictionFactor = Math.pow(0.5, dt / frictionHalfLife);
const m = 6;
const rMax = 0.1;
const particleRad = 1;
const forceFactor = 10;
const matrix = makeRandomMatrix();
const colors = new Int32Array(n);
const positionsX = new Float32Array(n);
const positionsY = new Float32Array(n);
const velocitiesX = new Float32Array(n);
const velocitiesY = new Float32Array(n);

for(let i = 0; i < n; i++)
{
    colors[i] = Math.floor(Math.random() * m);
    positionsX[i] = Math.random();
    positionsY[i] = Math.random();
    velocitiesX[i] = 0;
    velocitiesY[i] = 0;
}

function makeRandomMatrix()
{

    const rows = [];
    for(let i = 0; i < m; i++)
    {
        const row = []
        for(let j = 0; j < m; j++)
        {
            row.push(Math.random() * 2 - 1);
        }
        rows.push(row);        
    }

    return rows;
    }

    displayMatrixData()

function updateParticles()
{
  
    //console.log("updateParticles: ");
    // update velocities
    for(let i = 0; i < n; i++)
    {
  
        let totalForceX = 0;
        let totalForceY = 0;
        
        for(let j = 0; j < n; j++)
        {
            if(j === i) continue;
            const rx = positionsX[j] - positionsX[i];
            const ry = positionsY[j] - positionsY[i];
            const r = Math.hypot(rx, ry);

            if(r > 0 && r < rMax)
            {
                const f = force(r / rMax, matrix[colors[i]][colors[j]]);
                console.log("Force f : " + f);
                totalForceX += rx / r * f;
                totalForceY += ry / r * f; 

            }        

        }

        totalForceX *= rMax * forceFactor;
        totalForceY *= rMax * forceFactor;

        velocitiesX[i] *= frictionFactor;
        velocitiesY[i] *= frictionFactor;

        velocitiesX[i] += totalForceX * dt;
        velocitiesY[i] += totalForceY * dt; 

    }
   
    // update positions
    for(let i = 0; i < n; i++)
    {
        positionsX[i] += velocitiesX[i] * dt;
        positionsY[i] += velocitiesY[i] * dt;

    }

}

function force(r, a)
{
    const beta = 0.3;
    //if(r == beta) return 0;

    if(r < beta)
    {
        return r / beta - 1;
    }else if (r > beta && r < 1)
    {
        return a * (1 - Math.abs(2 * r - 1 - beta) / (1 - beta));
    }else
    return 0;
}


function displayMatrixData()
{

    for(let i = 0; i < m; i++)
    {
        
        for(let j = 0; j < m; j++)
        {
            console.log(matrix[i][j]);
        }
                
    }
    
}

function loop()
{
    // update particles
    updateParticles()
    

    // draw particles
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientWidth);
    for(let i = 0; i < n; i++)
    {
        //console.log("Update Loop : " + i);
        ctx.beginPath();
       
        const screenX = positionsX[i] * canvas.clientWidth;
        const screenY = positionsY[i] * canvas.clientHeight;
        ctx.arc(screenX, screenY, particleRad, 0, 2 * Math.PI);
        //console.log("Particle Color : " + colors[i]);
        //const hue = "hsl(${360 * (colors[i] / m)}, 100%, 50%)";
        //ctx.fillStyle = 'hsl(${360 * (colors[i] / m)}, 100%, 50%)';
/*
        const hue = 360 * (colors[i] / m);
        const saturation = 100;
        const lightness = 50;
        const hsl = "'hsl(H, S% L%,)'".replace(/H/, hue).replace(/S/, saturation).replace(/L/, lightness);
*/
        ctx.fillStyle = getFullColor((colors[i] / 6) * 360);

        ctx.fill();
        
    }

    requestAnimationFrame(loop);

}

function getFullColor(value) 
{
  var fromH = 0;
  var toH = 360;

  var fromS = 0;
  var toS = 100;

  var fromL = 0;
  var toL = 50;

  var percent = 100;

  var hue = value;
  var saturation = 100;
  var lightness = 50;

  return 'hsl(H, S%, L%)'
    .replace(/H/, hue)
    .replace(/S/, saturation)
    .replace(/L/, lightness);
}


function DrawCircle()
{
    ctx.beginPath();
    ctx.arc(95,50,40,0,2*Math.PI);
    
    ctx.stroke();
}


//DrawCircle()

requestAnimationFrame(loop)

//displayMatrixData()


</script>

</body>
</html>
